name: Cron tick (reminders, briefing, weekly digest, calendar sync)

# Why this workflow looks the way it does:
#
# - GitHub throttles/delays scheduled workflows that fire every minute, especially under
#   load: a `* * * * *` schedule (previously run as a 3-way matrix here) got delayed by
#   5-20 minutes or silently dropped. `*/5 * * * *` is roughly GitHub's realistic floor for
#   reliable scheduled triggers, and using a single job (no matrix) means only one runner
#   boots per invocation instead of three. To claw back ~1-minute granularity from that
#   single runner boot, this job runs an INNER tick loop that calls /api/cron/reminders
#   AND /api/cron/sync five times each (t=0s, 60s, 120s, 180s, 240s) within the same run.
#   /api/cron/sync carries event-start reminders ("Standup in 15 min"), which are just as
#   time-sensitive as item reminders and useless at 5-minute granularity, so it rides the
#   same 60s inner cadence rather than firing only once per invocation like
#   briefing/weekly-digest do.
#
# - GitHub automatically DISABLES scheduled workflows in a repository that has gone 60 days
#   without any commit activity. If reminders silently stop firing, check whether this
#   workflow shows as disabled under the repo's Actions tab BEFORE debugging anything else.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# A delayed run (see above) can start while the previous one is still inside its 5-minute inner
# loop, and two overlapping ticks hitting /api/cron/sync would both read the same sync cursor
# and send the same calendar-conflict prompt twice. `cancel-in-progress: false` because the run
# already in flight is the one holding a tick loop mid-way through its reminders — cancelling it
# would drop pings it is the only chance to send.
concurrency:
  group: cron-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fire cron endpoints
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u

          # Calls one cron endpoint with retries/timeout, prints status + body,
          # and returns success/failure via exit code.
          call() {
            path="$1"
            response=$(curl -s -L -X POST "${APP_URL}${path}" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "Content-Type: application/json" \
              --retry 3 --retry-all-errors --retry-delay 5 --max-time 60 \
              -w "\n%{http_code}")
            http_code=$(echo "$response" | tail -1)
            body=$(echo "$response" | sed '$d')
            echo "  [$path] status=$http_code body=$body"
            [ "$http_code" = "200" ]
          }

          reminders_total=5
          reminders_failures=0

          echo "== t=0s: briefing, weekly-digest (once per invocation), sync, reminders =="
          call "/api/cron/briefing" || echo "::warning::briefing tick failed (once/day endpoint; will retry next invocation)"
          call "/api/cron/weekly-digest" || echo "::warning::weekly-digest tick failed (once/day endpoint; will retry next invocation)"
          call "/api/cron/sync" || echo "::warning::sync tick failed (will retry next tick)"
          call "/api/cron/reminders" || reminders_failures=$((reminders_failures + 1))

          for i in 1 2 3 4; do
            sleep 60
            echo "== t=${i}x60s: sync, reminders =="
            call "/api/cron/sync" || echo "::warning::sync tick failed (will retry next tick)"
            call "/api/cron/reminders" || reminders_failures=$((reminders_failures + 1))
          done

          reminders_ok=$((reminders_total - reminders_failures))
          echo "Reminders ticks: ${reminders_ok}/${reminders_total} succeeded"

          if [ "$reminders_failures" -gt 0 ] && [ "$reminders_failures" -lt "$reminders_total" ]; then
            echo "::warning::${reminders_failures}/${reminders_total} reminders ticks failed this run (partial failure, not failing the job)"
          fi

          if [ "$reminders_failures" -eq "$reminders_total" ]; then
            echo "::error::All ${reminders_total} reminders ticks failed this run - possible outage"
            exit 1
          fi

          exit 0

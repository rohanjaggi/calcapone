name: Cron backstop (reminders, briefing, weekly digest, calendar sync)

# This is a BACKSTOP, not the primary scheduler.
#
# Primary scheduling lives at cron-job.org, which offers true 1-minute granularity, custom
# headers, execution history and email alerts on failure -- none of which GitHub Actions
# provides. See the README for the job setup.
#
# This workflow stays because it costs nothing and covers the case where the external
# scheduler is the thing that breaks. Two caveats keep it in the backstop role rather than
# the primary one:
#
# - GitHub throttles, delays and silently drops scheduled workflows under load. `*/5` was
#   already the realistic floor, and even that ran late.
# - GitHub automatically DISABLES scheduled workflows in a repository that has gone 60 days
#   without commit activity. If reminders stop firing, check the Actions tab for a disabled
#   workflow BEFORE debugging anything else.
#
# Firing the same endpoints as cron-job.org is safe: every one of them claims before it
# sends (claimUpdate, claimDueReminder, claimNotificationStage, the sync claim, and the
# date-guarded briefing/digest), so a double tick cannot double-send.
#
# Note: the endpoints do NOT self-monitor for tick gaps. A threshold low enough to catch a
# dead scheduler also trips on every run whenever this */15 backstop is the one carrying, so
# it flooded precisely when the primary was down. A dead scheduler shows up as a stale
# lastCalendarSyncAt instead.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# A delayed run can start while the previous one is still going. `cancel-in-progress: false`
# because the run already in flight may be mid-send, and cancelling it would drop pings.
concurrency:
  group: cron-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fire cron endpoints
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u

          # Calls one cron endpoint with retries/timeout, prints status + body,
          # and returns success/failure via exit code.
          call() {
            path="$1"
            response=$(curl -s -L -X POST "${APP_URL}${path}" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "Content-Type: application/json" \
              --retry 3 --retry-all-errors --retry-delay 5 --max-time 60 \
              -w "\n%{http_code}")
            http_code=$(echo "$response" | tail -1)
            body=$(echo "$response" | sed '$d')
            echo "  [$path] status=$http_code body=$body"
            [ "$http_code" = "200" ]
          }

          call "/api/cron/briefing"       || echo "::warning::briefing tick failed (once/day endpoint; will retry next run)"
          call "/api/cron/weekly-digest"  || echo "::warning::weekly-digest tick failed (once/day endpoint; will retry next run)"
          call "/api/cron/sync"           || echo "::warning::sync tick failed (will retry next run)"

          if ! call "/api/cron/reminders"; then
            echo "::error::reminders tick failed"
            exit 1
          fi
